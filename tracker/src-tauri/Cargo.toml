[package]
name = "sputnik"
version = "0.2.0"
description = "Спутник — трекер задач поверх Google Tasks и Calendar"
authors = ["Siponik"]
edition = "2021"

[lib]
name = "sputnik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
