<svg xmlns="http://www.w3.org/2000/svg" class="coon" viewBox="0 0 240 260" width="480" height="520" role="img" aria-label="Енот-космонавт Спутника"><style>.sp-app{--rim:#C9D6E2}.sp-app[data-theme="light"]{--rim:#A9BCCB}.coon{overflow:visible;display:block}.coon .c-float{animation:c-float 5.5s ease-in-out infinite;transform-box:view-box;transform-origin:120px 150px}.coon .c-wave{animation:c-wave 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:154px 196px}.coon .c-tail{animation:c-tail 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:150px 222px}.coon .c-ear{animation:c-ear 6s ease-in-out infinite;transform-box:view-box;transform-origin:146px 84px}.coon .c-eye{animation:c-blink 4.8s infinite;transform-box:fill-box;transform-origin:center}.coon .c-beacon{animation:c-beacon 1.6s ease-in-out infinite}.coon .c-star{animation:c-twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.coon .c-hop{animation:c-hop 1.1s cubic-bezier(.3,.6,.4,1) infinite;transform-box:view-box;transform-origin:120px 250px}.coon .c-z{animation:c-z 3s ease-in-out infinite;opacity:0}.coon .c-dot{animation:c-dot 1.4s ease-in-out infinite}.coon .c-orb{animation:c-orb 6s linear infinite;transform-box:view-box;transform-origin:120px 216px}.coon .c-flag{animation:c-flag 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:190px 100px}@keyframes c-float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}@keyframes c-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}@keyframes c-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}@keyframes c-ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(8deg)}94%{transform:rotate(-3deg)}}@keyframes c-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes c-beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes c-twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}@keyframes c-hop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.95)}45%{transform:translateY(-12px) scaleY(1.02)}}@keyframes c-z{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}@keyframes c-dot{0%,100%{opacity:.25}50%{opacity:1}}@keyframes c-orb{to{transform:rotate(360deg)}}@keyframes c-flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}@media (prefers-reduced-motion:reduce){.coon *{animation:none!important}.coon .c-z,.coon .c-dot{opacity:1}}.coon{--rim:#C9D6E2;--gold:#E0A04A;--clay:#D9774F;--signal-done:#6FB6CF;--ink-soft:#A8A69D;--font-sans:"Segoe UI",system-ui,sans-serif}</style><defs><radialGradient id="cn6-fur" cx="0.38" cy="0.3" r="0.85"><stop offset="0" stop-color="#D3CEC4"></stop><stop offset="0.55" stop-color="#A39E94"></stop><stop offset="1" stop-color="#6E6A62"></stop></radialGradient><radialGradient id="cn6-mask" cx="0.42" cy="0.3" r="0.9"><stop offset="0" stop-color="#5A5650"></stop><stop offset="1" stop-color="#2A2826"></stop></radialGradient><radialGradient id="cn6-cream" cx="0.42" cy="0.22" r="0.9"><stop offset="0" stop-color="#FFFDF8"></stop><stop offset="1" stop-color="#D8D2C6"></stop></radialGradient><radialGradient id="cn6-dark" cx="0.34" cy="0.28" r="0.8"><stop offset="0" stop-color="#6E6A62"></stop><stop offset="1" stop-color="#2A2826"></stop></radialGradient><radialGradient id="cn6-clay" cx="0.34" cy="0.25" r="0.95"><stop offset="0" stop-color="#FFB48C"></stop><stop offset="1" stop-color="#C85A30"></stop></radialGradient><radialGradient id="cn6-gold" cx="0.34" cy="0.25" r="0.95"><stop offset="0" stop-color="#FFE0A0"></stop><stop offset="1" stop-color="#D18F2C"></stop></radialGradient><radialGradient id="cn6-ear" cx="0.5" cy="0.65" r="0.7"><stop offset="0" stop-color="#F7CDBA"></stop><stop offset="1" stop-color="#D8927C"></stop></radialGradient><radialGradient id="cn6-suit" cx="0.34" cy="0.2" r="0.95"><stop offset="0" stop-color="#FCFAF5"></stop><stop offset="0.6