<svg xmlns="http://www.w3.org/2000/svg" class="coon" viewBox="0 0 210 218" width="400" height="415" role="img" aria-label="Енот-космонавт Спутника"><style>.sp-app{--fur:#A29D92;--fur-dark:#4A4741;--fur-light:#F4F1EA;--ear-in:#EBC6BA;--blush:#F2A08E;--suit:#EEEAE2;--suit-shade:#CFC9BD;--metal:#8E897F;--rim:#B8C6D2;--glass:rgba(170,200,228,.13);--coon-line:#2A2825;--eye:#161513}.sp-app[data-theme="light"]{--glass:rgba(110,150,190,.10);--rim:#9FB0BF}.coon{overflow:visible;display:block}.coon .c-float{animation:c-float 5.5s ease-in-out infinite;transform-box:view-box;transform-origin:100px 120px}.coon .c-wave{animation:c-wave 1.8s ease-in-out infinite;transform-box:view-box;transform-origin:132px 166px}.coon .c-tail{animation:c-tail 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:128px 178px}.coon .c-ear{animation:c-ear 6s ease-in-out infinite;transform-box:view-box;transform-origin:126px 66px}.coon .c-eye{animation:c-blink 4.8s infinite;transform-box:fill-box;transform-origin:center}.coon .c-beacon{animation:c-beacon 1.6s ease-in-out infinite}.coon .c-star{animation:c-twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.coon .c-hop{animation:c-hop 1.1s cubic-bezier(.3,.6,.4,1) infinite;transform-box:view-box;transform-origin:100px 206px}.coon .c-z{animation:c-z 3s ease-in-out infinite;opacity:0}.coon .c-dot{animation:c-dot 1.4s ease-in-out infinite}.coon .c-orb{animation:c-orb 6s linear infinite;transform-box:view-box;transform-origin:100px 168px}.coon .c-flag{animation:c-flag 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:158px 92px}@keyframes c-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}@keyframes c-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}@keyframes c-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes c-ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(9deg)}94%{transform:rotate(-3deg)}}@keyframes c-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes c-beacon{0%,100%{opacity:.35}50%{opacity:1}}@keyframes c-twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}@keyframes c-hop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.94)}45%{transform:translateY(-12px) scaleY(1.02)}}@keyframes c-z{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}@keyframes c-dot{0%,100%{opacity:.25}50%{opacity:1}}@keyframes c-orb{to{transform:rotate(360deg)}}@keyframes c-flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}@media (prefers-reduced-motion:reduce){.coon *{animation:none!important}.coon .c-z,.coon .c-dot{opacity:1}}.coon{--rim:#B8C6D2;--gold:#E0A04A;--clay:#D9774F;--signal-done:#6FB6CF;--ink-soft:#A8A69D;--font-sans:"Segoe UI",system-ui,sans-serif}</style><defs><radialGradient id="cn3-fur" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="#C4BFB4"></stop><stop offset=".55" stop-color="#9B968C"></stop><stop offset="1" stop-color="#6C6860"></stop></radialGradient><radialGradient id="cn3-mask" cx=".42" cy=".3" r=".9"><stop offset="0" stop-color="#5C5852"></stop><stop offset="1" stop-color="#2E2C29"></stop></radialGradient><radialGradient id="cn3-cream" cx=".42" cy=".22" r=".9"><stop offset="0" stop-color="#FFFDF8"></stop><stop offset="1" stop-color="#D6D0C4"></stop></radialGradient><radialGradient id="cn3-suit" cx=".36" cy=".2" r=".95"><stop offset="0" stop-color="#FCFAF5"></stop><stop offset=".6" stop-color="#E1DCD2"></stop><stop offset="1" stop-color="#B3AC9F"></stop></radialGradient><linearGradient id="cn3-sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF8F2"></stop><stop offset="1" stop-color="#C4BDB0"></stop></linearGradient><radialGradient id="cn3-dark" cx=".34" cy=".28" r=".8"><stop offset="0" stop-color="#6E6A62"></stop><stop offset="1" stop-color="#2B2927"></stop></radialGradient><radialGradient id="cn3-