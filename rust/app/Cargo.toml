[package]
name = "sputnik"
version = "0.1.0"
edition = "2021"
description = "Спутник — трекер задач поверх Google Tasks и Calendar (Rust + Slint)"

[dependencies]
sputnik-core = { path = "../core" }
slint = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"
minisign-verify = "0.2"

[build-dependencies]
slint-build = "1.18"
