[package]
name = "sputnik"
version = "0.1.0"
edition = "2021"
description = "Спутник — трекер задач поверх Google Tasks и Calendar (Rust + Slint)"

[dependencies]
sputnik-core = { path = "../core" }
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"
minisign-verify = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pulldown-cmark = { version = "0.13", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
rfd = "0.15"

[build-dependencies]
slint-build = "1.18"
