[package]
name = "sputnik-core"
version = "0.1.0"
edition = "2021"
description = "Чистая логика Спутника: без окна, файлов и сети"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.14"
serde_json = { version = "1", features = ["preserve_order"] }
once_cell = "1"
