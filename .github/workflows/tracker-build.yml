name: Сборка трекера

on:
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker/src-tauri -> target

      - name: Зависимости интерфейса
        working-directory: tracker
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      - name: Сборка установщика
        working-directory: tracker
        run: npx tauri build 2>&1 | tee -a ../build.log

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-msi
          path: tracker/src-tauri/target/release/bundle/msi/*.msi

      - name: Выпустить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSI=$(ls tracker/src-tauri/target/release/bundle/msi/*.msi | head -1)
          TAG="tracker-0.2.${{ github.run_number }}"
          gh release create "$TAG" "$MSI" \
            --title "Спутник 0.2 · сборка ${{ github.run_number }}" \
            --notes "Установщик для Windows. Скачайте .msi ниже и запустите. Windows может предупредить, что издатель неизвестен: «Подробнее» → «Выполнить в любом случае»." \
            --prerelease

      - name: Отправить лог ошибки в issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          NUM=$(gh issue list --state open --search "CI: сборка трекера in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "CI: сборка трекера" --body "Сюда автоматически приходят логи упавших сборок трекера." | grep -o '[0-9]*$')
          fi
          {
            echo "Сборка #${{ github.run_number }} упала, коммит ${{ github.sha }}."
            echo
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } > comment.md
          gh issue comment "$NUM" --body-file comment.md
