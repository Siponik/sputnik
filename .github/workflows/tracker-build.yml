name: Сборка трекера

# main — обычные релизы для всех; beta — бета-сборки (0.7.3-beta.1…), их получает только тот, кто включил
# «Бета-версии» в Настройки → Обновления (строка видна только владельцу). Бета-канал — релиз tracker-beta с latest.json.
on:
  push:
    branches: [main, beta]
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-build.yml"
      - "tools/ci/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история и теги — для «Что нового» с прошлого релиза

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker/src-tauri -> target

      - name: Зависимости интерфейса
        working-directory: tracker
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      # Версия: МАЖОР.МИНОР — из tauri.conf.json, третье число — следующее после вышедших релизов этого минора
      # (первый — x.y.0, потом x.y.1…). Новый минор — поменять версию в tauri.conf.json на x.(y+1).0.
      - name: Версия
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BETA: ${{ github.ref_name == 'beta' }}
        run: |
          TAGS=$(git ls-remote --tags origin 'tracker-*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u)
          if [ "$BETA" = "true" ]; then NEXT=next-beta; else NEXT=next; fi
          VER=$(node tools/ci/tracker-release.mjs $NEXT $TAGS)
          echo "VER=$VER" >> "$GITHUB_ENV"
          node tools/ci/tracker-release.mjs prepare "$VER" 2>&1 | tee -a build.log

      - name: Сборка установщика
        working-directory: tracker
        env:
          # Ключ подписи обновлений (закрытая часть — только в секретах; открытая — в tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Общий ключ Google (содержимое client_secret.json, клиент Desktop app) — встраивается в приложение,
          # чтобы людям не нужен был свой файл. Без секрета приложение, как раньше, попросит client_secret.json.
          SPUTNIK_GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: npx tauri build 2>&1 | tee -a ../build.log

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-msi
          path: tracker/src-tauri/target/release/bundle/msi/*.msi

      # Релиз в этом (публичном) репозитории. С ключом подписи (секрет TAURI_SIGNING_PRIVATE_KEY) он «последний»
      # и несёт .msi.sig и latest.json — по ним установленный Спутник обновляется сам
      # (tauri.conf.json → plugins.updater → …/releases/latest/download/latest.json).
      # Без ключа — пререлиз только с .msi, как раньше: так он не перебивает последнюю подписанную версию.
      - name: Выпустить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          BETA: ${{ github.ref_name == 'beta' }}
        run: |
          MSI=$(ls tracker/src-tauri/target/release/bundle/msi/*.msi | head -1)
          # «Что нового»: разделы «## Что нового» из PR с прошлого релиза, иначе названия коммитов (tools/ci/notes.mjs).
          TAGS=$(git tag -l 'tracker-*')
          if [ "$BETA" = "true" ]; then NOTE=$(node tools/ci/notes.mjs --beta $TAGS); else NOTE=$(node tools/ci/notes.mjs $TAGS); fi
          echo "$NOTE"
          HELP="Первая установка: скачайте .msi ниже и запустите. Windows может предупредить, что издатель неизвестен: «Подробнее» → «Выполнить в любом случае». Дальше Спутник обновляется сам."
          if [ "$BETA" = "true" ]; then
            # Бета: пререлиз (не «последний» — обычные пользователи его не видят) и latest.json в канале tracker-beta.
            if [ "$HAS_KEY" != "true" ]; then echo "::error::Бете нужен секрет TAURI_SIGNING_PRIVATE_KEY"; exit 1; fi
            node tools/ci/tracker-release.mjs latest "$VER" "$MSI" "$NOTE"
            gh release create "tracker-$VER" "$MSI" "$MSI.sig" --target "$GITHUB_SHA" --prerelease \
              --title "Спутник $VER (бета)" --notes "Бета-сборка из ветки beta — для проверки перед обычным релизом."$'\n\n'"$NOTE"
            if ! gh release view tracker-beta >/dev/null 2>&1; then
              gh release create tracker-beta --target "$GITHUB_SHA" --prerelease --title "Спутник · бета-канал" \
                --notes "Служебный релиз: здесь лежит latest.json последней бета-сборки. Устанавливать отсюда не нужно."
            fi
            gh release upload tracker-beta "$(dirname "$MSI")/latest.json" --clobber
          elif [ "$HAS_KEY" = "true" ]; then
            node tools/ci/tracker-release.mjs latest "$VER" "$MSI" "$NOTE"
            gh release create "tracker-$VER" "$MSI" "$MSI.sig" "$(dirname "$MSI")/latest.json" \
              --title "Спутник $VER" --notes "$NOTE"$'\n\n'"$HELP" --latest
          else
            echo "::warning::Нет секрета TAURI_SIGNING_PRIVATE_KEY — релиз без обновления из приложения."
            gh release create "tracker-$VER" "$MSI" \
              --title "Спутник $VER" --notes "$NOTE"$'\n\n'"$HELP" --prerelease
          fi

      - name: Отправить лог ошибки в issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          NUM=$(gh issue list --state open --search "CI: сборка трекера in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "CI: сборка трекера" --body "Сюда автоматически приходят логи упавших сборок трекера." | grep -o '[0-9]*$')
          fi
          {
            echo "Сборка #${{ github.run_number }} упала, коммит ${{ github.sha }}."
            echo
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } > comment.md
          gh issue comment "$NUM" --body-file comment.md
