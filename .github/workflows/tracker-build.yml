name: Сборка трекера

on:
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-build.yml"
      - "tools/ci/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker/src-tauri -> target

      - name: Зависимости интерфейса
        working-directory: tracker
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      # Версия: МАЖОР.МИНОР — из tauri.conf.json, третье число — следующее после вышедших релизов этого минора
      # (первый — x.y.0, потом x.y.1…). Новый минор — поменять версию в tauri.conf.json на x.(y+1).0.
      - name: Версия
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          TAGS=$(git ls-remote --tags origin 'tracker-*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u)
          VER=$(node tools/ci/tracker-release.mjs next $TAGS)
          echo "VER=$VER" >> "$GITHUB_ENV"
          node tools/ci/tracker-release.mjs prepare "$VER" 2>&1 | tee -a build.log

      - name: Сборка установщика
        working-directory: tracker
        env:
          # Ключ подписи обновлений (закрытая часть — только в секретах; открытая — в tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build 2>&1 | tee -a ../build.log

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-msi
          path: tracker/src-tauri/target/release/bundle/msi/*.msi

      # Релиз в этом (публичном) репозитории. С ключом подписи (секрет TAURI_SIGNING_PRIVATE_KEY) он «последний»
      # и несёт .msi.sig и latest.json — по ним установленный Спутник обновляется сам
      # (tauri.conf.json → plugins.updater → …/releases/latest/download/latest.json).
      # Без ключа — пререлиз только с .msi, как раньше: так он не перебивает последнюю подписанную версию.
      - name: Выпустить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          MSI=$(ls tracker/src-tauri/target/release/bundle/msi/*.msi | head -1)
          NOTE=$(git log -1 --format=%s)
          HELP="Первая установка: скачайте .msi ниже и запустите. Windows может предупредить, что издатель неизвестен: «Подробнее» → «Выполнить в любом случае». Дальше Спутник обновляется сам."
          if [ "$HAS_KEY" = "true" ]; then
            node tools/ci/tracker-release.mjs latest "$VER" "$MSI" "$NOTE"
            gh release create "tracker-$VER" "$MSI" "$MSI.sig" "$(dirname "$MSI")/latest.json" \
              --title "Спутник $VER" --notes "$NOTE"$'\n\n'"$HELP" --latest
          else
            echo "::warning::Нет секрета TAURI_SIGNING_PRIVATE_KEY — релиз без обновления из приложения."
            gh release create "tracker-$VER" "$MSI" \
              --title "Спутник $VER" --notes "$NOTE"$'\n\n'"$HELP" --prerelease
          fi

      - name: Отправить лог ошибки в issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          NUM=$(gh issue list --state open --search "CI: сборка трекера in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "CI: сборка трекера" --body "Сюда автоматически приходят логи упавших сборок трекера." | grep -o '[0-9]*$')
          fi
          {
            echo "Сборка #${{ github.run_number }} упала, коммит ${{ github.sha }}."
            echo
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } > comment.md
          gh issue comment "$NUM" --body-file comment.md
