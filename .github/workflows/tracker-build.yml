name: Сборка трекера

on:
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - ".github/workflows/tracker-build.yml"
      - "tools/ci/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker/src-tauri -> target

      - name: Зависимости интерфейса
        working-directory: tracker
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      # Версия 0.3.<номер сборки>: по ней приложение понимает, что вышло обновление.
      - name: Версия
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node tools/ci/tracker-release.mjs prepare ${{ github.run_number }} 2>&1 | tee -a build.log

      - name: Сборка установщика
        working-directory: tracker
        env:
          # Ключ подписи обновлений (закрытая часть — только в секретах; открытая — в tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build 2>&1 | tee -a ../build.log

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-msi
          path: tracker/src-tauri/target/release/bundle/msi/*.msi

      - name: Выпустить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSI=$(ls tracker/src-tauri/target/release/bundle/msi/*.msi | head -1)
          TAG="tracker-0.3.${{ github.run_number }}"
          gh release create "$TAG" "$MSI" \
            --title "Спутник 0.3.${{ github.run_number }}" \
            --notes "Установщик для Windows. Скачайте .msi ниже и запустите. Windows может предупредить, что издатель неизвестен: «Подробнее» → «Выполнить в любом случае». Дальше Спутник обновляется сам." \
            --prerelease

      # Обновление из приложения: подписанный установщик и latest.json — в публичный Siponik/sputnik-releases
      # (приватный репозиторий приложение без пароля не читает). Нужны секреты RELEASES_TOKEN и TAURI_SIGNING_PRIVATE_KEY.
      - name: Опубликовать обновление
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Обновление из приложения не опубликовано: нет секретов RELEASES_TOKEN / TAURI_SIGNING_PRIVATE_KEY."
            exit 0
          fi
          MSI=$(ls tracker/src-tauri/target/release/bundle/msi/*.msi | head -1)
          NOTE=$(git log -1 --format=%s)
          node tools/ci/tracker-release.mjs latest ${{ github.run_number }} "$MSI" "$NOTE"
          gh release create "v0.3.${{ github.run_number }}" "$MSI" "$MSI.sig" "$(dirname "$MSI")/latest.json" \
            --repo Siponik/sputnik-releases \
            --title "Спутник 0.3.${{ github.run_number }}" \
            --notes "$NOTE" \
            --latest

      - name: Отправить лог ошибки в issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          NUM=$(gh issue list --state open --search "CI: сборка трекера in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "CI: сборка трекера" --body "Сюда автоматически приходят логи упавших сборок трекера." | grep -o '[0-9]*$')
          fi
          {
            echo "Сборка #${{ github.run_number }} упала, коммит ${{ github.sha }}."
            echo
            echo '```'
            tail -c 60000 build.log
            echo '```'
          } > comment.md
          gh issue comment "$NUM" --body-file comment.md
