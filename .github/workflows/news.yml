# Новости для утренней сводки — без Claude: RSS-ленты + один запрос к бесплатной модели (Gemini) на пересказ.
# Страница публикуется на GitHub Pages: https://<владелец>.github.io/sputnik/news/ (только публичные новости, личного там нет).
# Общий бот (bot/src/brief.js) утром читает news/data.json и присылает ссылку вместе с задачами и встречами дня.
# Нужно один раз: Settings → Pages → Source: «GitHub Actions». Пересказ — GitHub Models (бесплатно, без ключа,
# токен самого Actions). Свой ключ по желанию: секрет GEMINI_API_KEY или LLM_KEY + переменные LLM_URL/LLM_MODEL.
# Модель не ответила — новости собираются без пересказа: оригинальные заголовки и начало текста.
name: Новости

on:
  schedule:
    # Каждый день в 02:20 UTC = 05:20 МСК. Расписание GitHub ранним утром опаздывает на часы (23–27.10 — до 10:50 МСК)
    # или пропускается, поэтому ещё три попытки; если новости за сегодня уже собраны — запуск сразу заканчивается.
    - cron: "20 2 * * *"
    - cron: "47 2 * * *"
    - cron: "13 3 * * *"
    - cron: "41 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  models: read
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}news/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Прошлая сборка (чтобы не повторяться)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://$owner.github.io/${{ github.event.repository.name }}/news/data.json" -o prev.json || echo '{}' > prev.json

      - name: Уже собрано сегодня?
        id: done
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Europe/Moscow date +%F)
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('prev.json','utf8')).date === '$today' ? 0 : 1)"; then
            echo "Новости за $today уже собраны — пропускаю."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать новости
        if: steps.done.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LLM_KEY: ${{ secrets.LLM_KEY || github.token }}
          LLM_URL: ${{ vars.LLM_URL || 'https://models.github.ai/inference/chat/completions' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1-mini' }}
        run: |
          node tools/news/build.mjs site/news prev.json
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=news/"><a href="news/">Спутник · Новости</a>\n' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.done.outputs.skip != 'true'
        with:
          path: site

      - id: deploy
        if: steps.done.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
