# Проверка Rust-версии (rust/): тесты и проверка, что код собирается под Windows (cargo check, без .exe — сам .exe собирает rust-release.yml после слияния). Ничего не публикует.
name: Проверка Rust-приложения

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'tools/golden/**'
      - '.github/workflows/rust-check.yml'
  workflow_dispatch:

# Новый пуш в тот же PR отменяет недоделанную проверку.
concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check -p sputnik
