# Проверка PR, который трогает боты или новости: автотесты из tests/ (без зависимостей, node:test).
# Ничего не публикует — только ставит зелёную или красную галочку у PR.
name: Проверка ботов

on:
  pull_request:
    paths:
      - 'bot/**'
      - 'reminders/**'
      - 'tools/news/**'
      - 'tests/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

# Новый пуш в тот же PR отменяет недоделанную проверку.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        run: npm test
